services:

  demo-v1:
    build:
      context: .
    image: zero-downtime-demo-app:latest
    container_name: demo-v1
    environment:
      VERSION: demo-v1
    networks:
      - zero-downtime

  demo-v2:
    build:
      context: .
    image: zero-downtime-demo-app:latest
    container_name: demo-v2
    environment:
      VERSION: demo-v2
    networks:
      - zero-downtime

  nginx:
    image: nginx:alpine
    container_name: demo-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - demo-v1
    networks:
      - zero-downtime

networks:
  zero-downtime:
    name: zero-downtime-demo_default
